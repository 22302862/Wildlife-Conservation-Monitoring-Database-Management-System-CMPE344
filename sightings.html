<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>WildTrack - Sightings</title>
</head>
<body>
    <div class="sidebar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: #24a17e33; padding: 5px; border-radius: 8px;">🐾</div>
            <div>
                <h3 style="margin:0;">WildTrack</h3>
                <p style="font-size: 10px; color: var(--text-dim); margin:0;">Conservation DB</p>
            </div>
        </div>
        <nav style="margin-top: 40px;">
            <p onclick="location.href='dashboard.html'">📊 Dashboard</p>
            <p onclick="location.href='species.html'">🌿 Species</p>
            <p onclick="location.href='animals.html'">🐘 Animals</p>
            <p style="color: var(--teal-primary); background: #24a17e1a; padding: 10px; border-radius: 5px;">👁️ Sightings</p>
            <p onclick="location.href='rangers.html'">🛡️ Rangers</p>
            <p onclick="location.href='users.html'">⚙️ Users</p>
        </nav>
        <div class="profile-section">
            <div class="avatar" id="avatar-initial">A</div>
            <div>
                <p style="margin:0; font-size: 14px; font-weight: bold;" id="profile-name">admin</p>
                <p style="margin:0; font-size: 11px; color: var(--text-dim);" id="profile-role">Administrator</p>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
                <h1 style="margin:0;">Sightings</h1>
                <p style="color: var(--text-dim); margin:0;">Field observation log</p>
            </div>
            <button class="btn-add" style="margin:0;" onclick="openAddModal()">+ Log Sighting</button>
        </div>

        <input type="text" class="search-bar" id="search-input"
               placeholder="🔍 Filter by species, ranger, zone, date..."
               oninput="filterSightings(this.value)"/>

        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Animal</th><th>Species</th>
                    <th>Location</th><th>Ranger</th><th>Date</th><th>Notes</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="sightings-tbody">
                <tr><td colspan="8" style="text-align:center; color: var(--text-dim);">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ADD SIGHTING MODAL -->
    <div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center;">
        <div style="background:#1a2220; border:1px solid #2a3532; border-radius:16px; padding:30px; width:420px;">
            <h3 style="margin:0 0 20px;">Log New Sighting</h3>

            <div class="input-group">
                <label>Animal</label>
                <select id="f-animal_id"></select>
            </div>
            <div class="input-group">
                <label>Ranger</label>
                <select id="f-ranger_id"></select>
            </div>
            <div class="input-group">
                <label>Location</label>
                <input type="text" id="f-location" placeholder="e.g. Zone A, N2.4 E36.8"/>
            </div>
            <div class="input-group">
                <label>Date</label>
                <input type="date" id="f-sighting_date"/>
            </div>
            <div class="input-group">
                <label>Notes</label>
                <input type="text" id="f-notes" placeholder="Observations..."/>
            </div>

            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
                <button onclick="closeModal()" style="background:#2a3532; color:#888; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="saveSighting()" class="btn-add" style="margin:0;">Save</button>
            </div>
        </div>
    </div>

    <div id="toast" style="position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:8px; font-size:13px; font-weight:500; opacity:0; transition:all .3s; z-index:999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="operations.js"></script>
</body>
</html>
