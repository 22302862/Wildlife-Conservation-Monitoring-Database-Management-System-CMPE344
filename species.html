<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>WildTrack - Species</title>
</head>
<body>
    <div class="sidebar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: #24a17e33; padding: 5px; border-radius: 8px;">🐾</div>
            <div>
                <h3 style="margin:0;">WildTrack</h3>
                <p style="font-size: 10px; color: var(--text-dim); margin:0;">Conservation DB</p>
            </div>
        </div>
        <nav style="margin-top: 40px;">
            <p onclick="location.href='dashboard.html'">📊 Dashboard</p>
            <p style="color: var(--teal-primary); background: #24a17e1a; padding: 10px; border-radius: 5px;">🌿 Species</p>
            <p onclick="location.href='animals.html'">🐘 Animals</p>
            <p onclick="location.href='sightings.html'">👁️ Sightings</p>
            <p onclick="location.href='rangers.html'">🛡️ Rangers</p>
            <p onclick="location.href='users.html'">⚙️ Users</p>
        </nav>
        <div class="profile-section">
            <div class="avatar" id="avatar-initial">A</div>
            <div>
                <p style="margin:0; font-size: 14px; font-weight: bold;" id="profile-name">admin</p>
                <p style="margin:0; font-size: 11px; color: var(--text-dim);" id="profile-role">Administrator</p>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="margin:0;">Species</h1>
                <p style="color: var(--text-dim); margin:0;">Manage tracked wildlife species</p>
            </div>
            <button class="btn-add" style="margin:0;" onclick="openAddModal()">+ Add Species</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Common Name</th><th>Scientific Name</th>
                    <th>Conservation Status</th><th>Habitat</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="species-tbody">
                <tr><td colspan="6" style="text-align:center; color: var(--text-dim);">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center;">
        <div style="background:#1a2220; border:1px solid #2a3532; border-radius:16px; padding:30px; width:420px;">
            <h3 id="modal-title" style="margin:0 0 20px;">Add Species</h3>

            <div class="input-group">
                <label>Common Name</label>
                <input type="text" id="f-common_name" placeholder="e.g. African Elephant"/>
            </div>
            <div class="input-group">
                <label>Scientific Name</label>
                <input type="text" id="f-scientific_name" placeholder="e.g. Loxodonta africana"/>
            </div>
            <div class="input-group">
                <label>Conservation Status</label>
                <select id="f-conservation_status">
                    <option>Critically Endangered</option>
                    <option>Endangered</option>
                    <option>Vulnerable</option>
                    <option>Least Concern</option>
                </select>
            </div>
            <div class="input-group">
                <label>Habitat</label>
                <input type="text" id="f-habitat" placeholder="e.g. Savanna"/>
            </div>

            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
                <button onclick="closeModal()" style="background:#2a3532; color:#888; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="saveSpecies()" class="btn-add" style="margin:0;">Save</button>
            </div>
        </div>
    </div>

    <div id="toast" style="position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:8px; font-size:13px; font-weight:500; opacity:0; transition:all .3s; z-index:999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="operations.js"></script>
</body>
</html>
